<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteTourNOLA - Admin Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* Admin Specific Styles */
        body {
            background-color: #f4f4f4;
            padding-top: 0;
            /* Override hero padding */
        }

        .admin-container {
            max-width: 1000px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .login-screen {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }

        .dashboard-screen {
            display: none;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .restaurant-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .list-item:hover {
            border-color: var(--color-primary);
        }

        .item-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .item-rank {
            font-weight: bold;
            color: var(--color-primary);
            width: 30px;
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.8rem;
        }

        .btn-danger {
            background: #ff4444;
            color: white;
            border: none;
        }

        /* Modal Override for Admin */
        .edit-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .edit-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .edit-form {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 500px;
            max-width: 90%;
        }

        .form-row {
            margin-bottom: 15px;
        }

        .form-row label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-row input,
        .form-row select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <!-- Login Screen -->
    <div id="loginScreen" class="admin-container login-screen">
        <h2>Admin Login</h2>
        <p>Please sign in to manage restaurants.</p>
        <form id="loginForm" style="margin-top: 20px;">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-full">Login</button>
            <p id="loginError" style="color: red; margin-top: 10px; display: none;">Invalid credentials</p>
        </form>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardScreen" class="admin-container dashboard-screen">
        <div class="admin-header">
            <div>
                <h2>Restaurant Manager</h2>
                <p>Manage the top 100 list</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="addBtn" class="btn btn-primary btn-sm">+ Add New</button>
                <button id="logoutBtn" class="btn btn-secondary btn-sm">Logout</button>
            </div>
        </div>

        <div id="restaurantList" class="restaurant-list">
            <!-- Items injected here -->
            <div style="text-align: center; padding: 20px;">Loading...</div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="edit-modal">
        <div class="edit-form">
            <h3 id="modalTitle">Edit Restaurant</h3>
            <form id="editForm">
                <input type="hidden" id="editIndex">

                <div class="form-row">
                    <label>Name</label>
                    <input type="text" id="editName" required>
                </div>

                <div class="form-row" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Rank</label>
                        <input type="number" id="editRank" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Rating</label>
                        <input type="number" step="0.1" id="editRating" required>
                    </div>
                </div>

                <div class="form-row">
                    <label>Cuisine</label>
                    <input type="text" id="editCuisine" required>
                </div>

                <div class="form-row">
                    <label>Neighborhood</label>
                    <input type="text" id="editNeighborhood" required>
                </div>

                <div class="form-row">
                    <label>Website URL</label>
                    <input type="url" id="editUrl" placeholder="https://...">
                </div>

                <div class="form-row">
                    <label>Image URL</label>
                    <input type="url" id="editImage" placeholder="https://...">
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelEdit" class="btn btn-secondary btn-sm">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
