  {domain:"rondawise.com",name:"Ronda Wise",tagline:"Protected property",cat:"Protected",color:"#555",icon:"🔒",srv:"dl",prot:true},
  {domain:"sandybrew.com",name:"Sandy Brew",tagline:"Craft beer experience",cat:"Protected",color:"#6cba96",icon:"🍺",srv:"ams",prot:true},

];

var cat="all",q="";

function dk(h,a){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return"rgb("+Math.round(r*a)+","+Math.round(g*a)+","+Math.round(b*a)+")";}

function render(){
  var f=D.filter(function(d){return(cat==="all"||d.cat===cat)&&(!q||[d.name,d.tagline,d.domain,d.cat].join(" ").toLowerCase().indexOf(q)>=0);});
  document.getElementById("showing").textContent=f.length;
  document.getElementById("nc").textContent=f.length+" domains";
  var g=document.getElementById("grid");
  if(!f.length){g.innerHTML='<div class="nores">No results found.</div>';return;}
  var h="";
  for(var i=0;i<f.length;i++){
    var d=f[i];
    var bg="linear-gradient(135deg,"+d.color+" 0%,"+dk(d.color,0.55)+" 100%)";
    var srvLabel=d.srv==="ams"?"AMS":"DL";
    var protBadge=d.prot?'<div class="plock">&#128274; Protected</div>':"";
    h+='<a class="card" href="https://'+d.domain+'/" target="_blank" rel="noopener">'
      +'<div class="thumb" style="background:'+bg+';">'
      +'<div class="tshine"></div>'
      +'<div class="ticon">'+d.icon+'</div>'
      +'<div class="tbot"><div class="tname">'+d.name+'</div><div class="ttag">'+d.tagline+'</div></div>'
      +'<div class="tbadge">'+d.cat+'</div>'
      +protBadge
      +'</div>'
      +'<div class="cbody"><div class="cname">'+d.name+'</div>'
      +'<div class="cmeta"><span class="cdom">'+d.domain+'</span>'
      +'<span class="csrv csrv-'+(d.srv==="ams"?"ams":"dl")+'">'+srvLabel+'</span>'
      +'</div></div>'
      +'</a>';
  }
  g.innerHTML=h;
}

document.querySelectorAll(".cb").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".cb").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    cat=b.dataset.c;
    render();
  });
});
document.getElementById("search").addEventListener("input",function(e){q=e.target.value.toLowerCase();render();});
render();
</script>
